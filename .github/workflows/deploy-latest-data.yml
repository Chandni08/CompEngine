name: Deploy latest validated competitive-intelligence data

on:
  workflow_run:
    workflows:
      - Daily competitive-intelligence data refresh
    types:
      - completed
  workflow_dispatch:
    inputs:
      data_ref:
        description: Validated commit or branch to deploy; blank uses the default branch
        required: false
        default: ""
        type: string

permissions:
  actions: read
  contents: read

jobs:
  resolve_data_commit:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.resolve.outputs.should_deploy }}
      data_commit: ${{ steps.resolve.outputs.data_commit }}
    steps:
      - name: Download the refresh workflow's validated data reference
        id: download
        if: github.event_name == 'workflow_run'
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          name: validated-data-ref
          path: ${{ runner.temp }}/validated-data-ref
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Check out the manually requested data reference
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.data_ref || github.event.repository.default_branch }}

      - name: Resolve the immutable data commit
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_run" ]; then
            reference_file="$RUNNER_TEMP/validated-data-ref/data_commit.txt"
            if [ ! -f "$reference_file" ]; then
              echo "should_deploy=false" >> "$GITHUB_OUTPUT"
              echo "No validated data reference was published; the refresh was skipped"
              exit 0
            fi
            data_commit=$(tr -d '[:space:]' < "$reference_file")
          else
            data_commit=$(git rev-parse HEAD)
          fi
          if [[ ! "$data_commit" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid validated data commit: $data_commit" >&2
            exit 1
          fi
          echo "should_deploy=true" >> "$GITHUB_OUTPUT"
          echo "data_commit=$data_commit" >> "$GITHUB_OUTPUT"
          echo "Resolved validated data commit $data_commit"

  # Add each future platform as a sibling job that needs resolve_data_commit,
  # checks out needs.resolve_data_commit.outputs.data_commit, and owns its own
  # credentials, concurrency group, deployment, and verification steps.
  deploy_vercel:
    needs: resolve_data_commit
    if: needs.resolve_data_commit.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: deploy-vercel-production
      cancel-in-progress: false
    steps:
      - name: Check out the exact validated data commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve_data_commit.outputs.data_commit }}

      - name: Validate the deployable package
        working-directory: deploy-site
        run: node scripts/validate_deploy.mjs

      - name: Deploy the validated build to Vercel
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          : "${VERCEL_TOKEN:?VERCEL_TOKEN is required for unattended deployment}"
          : "${VERCEL_ORG_ID:?VERCEL_ORG_ID is required for unattended deployment}"
          : "${VERCEL_PROJECT_ID:?VERCEL_PROJECT_ID is required for unattended deployment}"
          npx --yes vercel@59.10.0 build --prod --yes --token "$VERCEL_TOKEN"
          deploy_package=$(mktemp -d "$RUNNER_TEMP/vercel-prebuilt.XXXXXX")
          mkdir -p "$deploy_package/.vercel" "$deploy_package/deploy-site/.vercel"
          cp -R .vercel/output "$deploy_package/.vercel/output"
          cp .vercel/project.json "$deploy_package/.vercel/project.json"
          cp -R .vercel/output "$deploy_package/deploy-site/.vercel/output"
          cp .vercel/project.json "$deploy_package/deploy-site/.vercel/project.json"
          test -f "$deploy_package/.vercel/output/config.json"
          test -f "$deploy_package/deploy-site/.vercel/output/config.json"
          deployment_output=$(cd "$deploy_package" && npx --yes vercel@59.10.0 deploy --prebuilt --prod --yes --skip-domain --token "$VERCEL_TOKEN")
          printf '%s\n' "$deployment_output"
          deployment_url=$(printf '%s\n' "$deployment_output" | grep -Eo 'https://[^[:space:]]+\.vercel\.app' | tail -n 1)
          test -n "$deployment_url"
          echo "deployment_url=$deployment_url" >> "$GITHUB_OUTPUT"

      - name: Verify the exact refreshed Vercel deployment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment_url }}
          WATERS_HOST: waters-nextgen-competitive-engine.vercel.app
        run: |
          expected_date=$(python3 -c 'import json; print(json.load(open("data/refresh_status.json"))["datasetAsOfDate"])')
          expected_refresh_at=$(python3 -c 'import json; print(json.load(open("data/refresh_status.json"))["lastSuccessfulRefreshAt"])')
          npx --yes vercel@59.10.0 alias set "$DEPLOYMENT_URL" "$WATERS_HOST" --token "$VERCEL_TOKEN"
          for attempt in $(seq 1 20); do
            deployment_status=$(curl --fail --silent --show-error --location "$DEPLOYMENT_URL/data/refresh_status.json?verify=$GITHUB_RUN_ID-$attempt" || true)
            live_status=$(curl --fail --silent --show-error --location "https://$WATERS_HOST/data/refresh_status.json?verify=$GITHUB_RUN_ID-$attempt" || true)
            if DEPLOYMENT_STATUS="$deployment_status" LIVE_STATUS="$live_status" EXPECTED_DATE="$expected_date" EXPECTED_REFRESH_AT="$expected_refresh_at" python3 -c 'import json, os; expected_date=os.environ["EXPECTED_DATE"]; expected_refresh=os.environ["EXPECTED_REFRESH_AT"]; values=[json.loads(os.environ[name]) for name in ("DEPLOYMENT_STATUS", "LIVE_STATUS")]; assert all(value["status"] == "success" and value["allRequiredSourcesCurrent"] is True and value["datasetAsOfDate"] == expected_date and value["lastSuccessfulRefreshAt"] == expected_refresh for value in values)' 2>/dev/null; then
              echo "Verified exact deployment and $WATERS_HOST at refresh $expected_refresh_at"
              exit 0
            fi
            sleep 10
          done
          echo "Vercel did not expose the exact validated dataset" >&2
          exit 1
