name: Daily competitive-intelligence data refresh

on:
  schedule:
    # Avoid GitHub's top-of-hour scheduler congestion. These provide two daily
    # refresh opportunities around 7–8 AM New York time. GitHub may start a
    # scheduled event hours late, so the gate below relies on dataset freshness
    # rather than the runner's actual start hour.
    - cron: "17 11 * * *"
    - cron: "17 12 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-competitive-intelligence-refresh
  cancel-in-progress: false

jobs:
  schedule_gate:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.gate.outputs.should_run }}
    steps:
      - name: Check out refresh state
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Decide whether today's dataset needs a refresh
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          local_date=$(TZ=America/New_York date +%F)
          dataset_date=$(python -c 'import json; print(json.load(open("data/refresh_status.json")).get("datasetAsOfDate", ""))' 2>/dev/null || true)
          if [ "$EVENT_NAME" != "schedule" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "Running because this workflow was started manually"
          elif [ "$dataset_date" != "$local_date" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "Running because no successful dataset is published for $local_date"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "Skipping because a successful dataset is already published for $local_date"
          fi

  refresh_data:
    needs: schedule_gate
    if: needs.schedule_gate.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out the website
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install link-check dependencies
        run: python -m pip install "requests>=2.32,<3" "certifi>=2024.7.4"

      - name: Set up Chromium fallback for WAF-challenged official pages
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Refresh and validate public intelligence
        id: refresh
        env:
          AGILENT_HEADED: "1"
          SKIP_REFRESH_EXPORTS: "1"
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
        run: xvfb-run --auto-servernum scripts/run_daily_refresh.sh --refresh-only

      - name: Preserve failed validation evidence
        if: failure() && steps.refresh.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: failed-refresh-evidence-${{ github.run_id }}
          path: |
            audit/failed_link_health.json
            audit/failed_source_health.json
          if-no-files-found: warn
          retention-days: 14

      - name: Validate the production package
        working-directory: deploy-site
        run: node scripts/validate_deploy.mjs

      - name: Validate press-release freshness and completeness
        run: python scripts/validate_press_release_completeness.py

      - name: Run ingestion regression checks
        run: python -m unittest tests/test_customer_voice_ingestion.py tests/test_daily_refresh_resilience.py

      - name: Save the validated daily data
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name "competitive-intelligence-refresh"
          git config user.email "competitive-intelligence-refresh@users.noreply.github.com"
          git add data deploy-site/data
          git diff --cached --quiet || git commit -m "data: daily competitive-intelligence refresh"
          git push origin "HEAD:$DEFAULT_BRANCH"
