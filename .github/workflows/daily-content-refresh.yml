name: Daily competitive-intelligence refresh

on:
  schedule:
    # 11:17 UTC is 7:17 AM during daylight time, 12:17 UTC is the daylight
    # fallback or the 7:17 AM standard-time run, and 13:17 UTC is the
    # standard-time fallback. The gate keys off the scheduled cron expression,
    # not runner start time, because GitHub may delay scheduled jobs for hours.
    - cron: "17 11 * * *"
    - cron: "17 12 * * *"
    - cron: "17 13 * * *"
  workflow_dispatch:
    inputs:
      deploy_only:
        description: Deploy the latest validated dataset without recollecting sources
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: daily-competitive-intelligence-refresh
  cancel-in-progress: false

jobs:
  schedule_gate:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.gate.outputs.should_run }}
    steps:
      - name: Check out refresh state
        uses: actions/checkout@v7
        with:
          # A fallback run may have been queued before the primary run pushed
          # today's data, so read the branch head at execution time.
          ref: ${{ github.event.repository.default_branch }}

      - name: Decide whether today's refresh still needs to run
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: |
          local_date=$(TZ=America/New_York date +%F)
          ny_offset=$(TZ=America/New_York date +%z)
          dataset_date=$(python -c 'import json; print(json.load(open("data/refresh_status.json")).get("datasetAsOfDate", ""))')
          if [ "$EVENT_NAME" != "schedule" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "Running a manually dispatched refresh"
          elif [ "$dataset_date" = "$local_date" ]; then
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "Skipping: dataset $dataset_date is already current"
          elif [ "$EVENT_SCHEDULE" = "17 11 * * *" ] && [ "$ny_offset" = "-0400" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "Running the daylight-time primary schedule for $local_date"
          elif [ "$EVENT_SCHEDULE" = "17 12 * * *" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "Running the primary/fallback schedule for $local_date"
          elif [ "$EVENT_SCHEDULE" = "17 13 * * *" ] && [ "$ny_offset" = "-0500" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "Running the standard-time fallback schedule for $local_date"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "Skipping cron $EVENT_SCHEDULE for New York offset $ny_offset"
          fi

  refresh:
    needs: schedule_gate
    if: needs.schedule_gate.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out the website
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install link-check dependencies
        run: python -m pip install "requests>=2.32,<3" "certifi>=2024.7.4"

      - name: Set up Chromium fallback for WAF-challenged official pages
        if: github.event.inputs.deploy_only != 'true'
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Refresh and validate public intelligence
        id: refresh
        if: github.event.inputs.deploy_only != 'true'
        env:
          AGILENT_HEADED: "1"
          SKIP_REFRESH_EXPORTS: "1"
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
        run: xvfb-run --auto-servernum scripts/run_daily_refresh.sh --refresh-only

      - name: Preserve failed validation evidence
        if: failure() && steps.refresh.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: failed-refresh-evidence-${{ github.run_id }}
          path: |
            audit/failed_link_health.json
            audit/failed_source_health.json
          if-no-files-found: warn
          retention-days: 14

      - name: Validate the production package
        working-directory: deploy-site
        run: node scripts/validate_deploy.mjs

      - name: Validate press-release freshness and completeness
        run: python scripts/validate_press_release_completeness.py

      - name: Run ingestion regression checks
        run: python -m unittest tests/test_customer_voice_ingestion.py tests/test_daily_refresh_resilience.py

      - name: Save the validated daily data
        run: |
          git config user.name "competitive-intelligence-refresh"
          git config user.email "competitive-intelligence-refresh@users.noreply.github.com"
          git add data deploy-site/data
          git diff --cached --quiet || git commit -m "data: daily competitive-intelligence refresh"
          git push

      - name: Deploy the validated build to Vercel
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          WATERS_HOST: waters-nextgen-competitive-engine.vercel.app
        run: |
          : "${VERCEL_TOKEN:?VERCEL_TOKEN is required for unattended deployment}"
          : "${VERCEL_ORG_ID:?VERCEL_ORG_ID is required for unattended deployment}"
          : "${VERCEL_PROJECT_ID:?VERCEL_PROJECT_ID is required for unattended deployment}"
          # The Vercel project has deploy-site configured as its Root Directory,
          # so invoke the CLI from the repository root to resolve it once.
          deployment_output=$(npx --yes vercel@57.0.0 deploy --prod --yes --token "$VERCEL_TOKEN")
          printf '%s\n' "$deployment_output"
          deployment_url=$(printf '%s\n' "$deployment_output" | grep -Eo 'https://[^[:space:]]+\.vercel\.app' | tail -n 1)
          test -n "$deployment_url"
          echo "deployment_url=$deployment_url" >> "$GITHUB_OUTPUT"

      - name: Verify the exact refreshed Vercel deployment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment_url }}
          WATERS_HOST: waters-nextgen-competitive-engine.vercel.app
        run: |
          expected_date=$(TZ=America/New_York date +%F)
          expected_refresh_at=$(python -c 'import json; print(json.load(open("data/refresh_status.json"))["lastSuccessfulRefreshAt"])')
          npx --yes vercel@57.0.0 alias set "$DEPLOYMENT_URL" "$WATERS_HOST" --token "$VERCEL_TOKEN"
          for attempt in $(seq 1 20); do
            deployment_status=$(curl --fail --silent --show-error --location "$DEPLOYMENT_URL/data/refresh_status.json?verify=$GITHUB_RUN_ID-$attempt" || true)
            live_status=$(curl --fail --silent --show-error --location "https://$WATERS_HOST/data/refresh_status.json?verify=$GITHUB_RUN_ID-$attempt" || true)
            if DEPLOYMENT_STATUS="$deployment_status" LIVE_STATUS="$live_status" EXPECTED_DATE="$expected_date" EXPECTED_REFRESH_AT="$expected_refresh_at" python -c 'import json, os; expected_date=os.environ["EXPECTED_DATE"]; expected_refresh=os.environ["EXPECTED_REFRESH_AT"]; values=[json.loads(os.environ[name]) for name in ("DEPLOYMENT_STATUS", "LIVE_STATUS")]; assert all(value["status"] == "success" and value["allRequiredSourcesCurrent"] is True and value["datasetAsOfDate"] == expected_date and value["lastSuccessfulRefreshAt"] == expected_refresh for value in values)' 2>/dev/null; then
              echo "Verified exact deployment and $WATERS_HOST at refresh $expected_refresh_at"
              exit 0
            fi
            sleep 10
          done
          echo "Vercel did not expose today's exact validated dataset" >&2
          exit 1
