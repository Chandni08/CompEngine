name: Daily competitive-intelligence refresh

on:
  schedule:
    - cron: "0 11 * * *"
    - cron: "0 12 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-competitive-intelligence-refresh
  cancel-in-progress: false

jobs:
  schedule_gate:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.gate.outputs.should_run }}
    steps:
      - name: Decide whether this is the 7 AM New York run
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" != "schedule" ] || [ "$(TZ=America/New_York date +%H)" = "07" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "Skipping because this schedule trigger is outside 7 AM America/New_York"
          fi

  refresh:
    needs: schedule_gate
    if: needs.schedule_gate.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out the website
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install link-check dependencies
        run: python -m pip install "requests>=2.32,<3" "certifi>=2024.7.4"

      - name: Set up Chromium fallback for WAF-challenged official pages
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Refresh and validate public intelligence
        id: refresh
        env:
          AGILENT_HEADED: "1"
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
        run: xvfb-run --auto-servernum python scripts/refresh_daily.py

      - name: Preserve failed validation evidence
        if: failure() && steps.refresh.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: failed-refresh-evidence-${{ github.run_id }}
          path: |
            audit/failed_link_health.json
            audit/failed_source_health.json
          if-no-files-found: warn
          retention-days: 14

      - name: Validate the production package
        working-directory: deploy-site
        run: node scripts/validate_deploy.mjs

      - name: Validate press-release freshness and completeness
        run: python scripts/validate_press_release_completeness.py

      - name: Run ingestion regression checks
        run: python -m unittest tests/test_customer_voice_ingestion.py

      - name: Save the validated daily data
        run: |
          git config user.name "competitive-intelligence-refresh"
          git config user.email "competitive-intelligence-refresh@users.noreply.github.com"
          git add data deploy-site/data
          git diff --cached --quiet || git commit -m "data: daily competitive-intelligence refresh"
          git push

      - name: Trigger Vercel deployment when a deploy hook is configured
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -n "$VERCEL_DEPLOY_HOOK" ]; then
            curl --fail --silent --show-error --request POST "$VERCEL_DEPLOY_HOOK"
          else
            echo "No deploy hook configured; relying on the Vercel Git integration."
          fi
