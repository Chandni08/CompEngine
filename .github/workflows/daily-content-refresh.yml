name: Daily competitive-intelligence refresh

on:
  schedule:
    # Avoid GitHub's top-of-hour scheduler congestion. These cover 7:17 AM
    # New York across daylight-saving transitions; the 8:17 AM EDT trigger is
    # retained as a same-day fallback if GitHub drops or the first run fails.
    - cron: "17 11 * * *"
    - cron: "17 12 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-competitive-intelligence-refresh
  cancel-in-progress: false

jobs:
  schedule_gate:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.gate.outputs.should_run }}
    steps:
      - name: Check out refresh state
        uses: actions/checkout@v7

      - name: Decide whether this is the 7 AM New York run
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          local_hour=$(TZ=America/New_York date +%H)
          local_date=$(TZ=America/New_York date +%F)
          dataset_date=$(python -c 'import json; print(json.load(open("data/refresh_status.json")).get("datasetAsOfDate", ""))')
          if [ "$EVENT_NAME" != "schedule" ] || [ "$local_hour" = "07" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          elif [ "$local_hour" = "08" ] && [ "$dataset_date" != "$local_date" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "Running the 8 AM fallback because no successful dataset is published for $local_date"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "Skipping: local hour is $local_hour and dataset date is ${dataset_date:-missing}"
          fi

  refresh:
    needs: schedule_gate
    if: needs.schedule_gate.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out the website
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install link-check dependencies
        run: python -m pip install "requests>=2.32,<3" "certifi>=2024.7.4"

      - name: Set up Chromium fallback for WAF-challenged official pages
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Refresh and validate public intelligence
        id: refresh
        env:
          AGILENT_HEADED: "1"
          SKIP_REFRESH_EXPORTS: "1"
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
        run: xvfb-run --auto-servernum scripts/run_daily_refresh.sh --refresh-only

      - name: Preserve failed validation evidence
        if: failure() && steps.refresh.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: failed-refresh-evidence-${{ github.run_id }}
          path: |
            audit/failed_link_health.json
            audit/failed_source_health.json
          if-no-files-found: warn
          retention-days: 14

      - name: Validate the production package
        working-directory: deploy-site
        run: node scripts/validate_deploy.mjs

      - name: Validate press-release freshness and completeness
        run: python scripts/validate_press_release_completeness.py

      - name: Run ingestion regression checks
        run: python -m unittest tests/test_customer_voice_ingestion.py tests/test_daily_refresh_resilience.py

      - name: Save the validated daily data
        run: |
          git config user.name "competitive-intelligence-refresh"
          git config user.email "competitive-intelligence-refresh@users.noreply.github.com"
          git add data deploy-site/data
          git diff --cached --quiet || git commit -m "data: daily competitive-intelligence refresh"
          git push

      - name: Wait for Vercel's Git deployment and verify the live dataset
        env:
          WATERS_HOST: waters-nextgen-competitive-engine.vercel.app
        run: |
          expected_date=$(TZ=America/New_York date +%F)
          # The validated data commit triggers the project's Vercel Git
          # integration. Poll the public alias until that deployment is live.
          for attempt in $(seq 1 30); do
            live_status=$(curl --fail --silent --show-error --location "https://$WATERS_HOST/data/refresh_status.json?verify=$GITHUB_RUN_ID-$attempt" || true)
            if LIVE_STATUS="$live_status" EXPECTED_DATE="$expected_date" python -c 'import json, os; value=json.loads(os.environ["LIVE_STATUS"]); assert value["status"] == "success" and value["allRequiredSourcesCurrent"] is True and value["datasetAsOfDate"] == os.environ["EXPECTED_DATE"]' 2>/dev/null; then
              echo "Verified $WATERS_HOST at dataset date $expected_date"
              exit 0
            fi
            sleep 10
          done
          echo "Vercel's Git deployment did not expose today's validated dataset" >&2
          exit 1
